<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <title>Ressources naturelles et mets culinaires</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
     <header>
          <nav>
               <ul class="nav-links">
                    <li><h1><a href="">QuizzTime</a></h1></li>
                    <li><a href="">Theme</a></li>
               </ul>
          </nav>
     </header>
     <main>
          <!-- ═══════════════════════════════════════
               ÉCRAN 1 — ACCUEIL
               Affiché au départ. Caché quand on clique sur "Commencer".
          ════════════════════════════════════════ -->
          <section id="ecran-accueil" class=""> 
               <article class="container-titre">
                    <h2>AdaQuiz</h2>
                    <h3>Ressources naturelles et mets culinaires</h3>
               </article>
               <picture class="container-image-ecran-accueil">
                    <img src="assets/visuel-ecran-accueil.jpeg" alt="">
               </picture>
               <article class="container-instruction">
                    <p>Appuie sur la bonne réponse</p> 
               </article>
               <article class="container-bouton">
                   <button id="btn-commencer">START QUIZZ</button> 
               </article>
          </section>

          <!-- ═══════════════════════════════════════
               ÉCRAN 2 — QUESTION
               Caché au départ. Affiché pendant le quiz.
          ════════════════════════════════════════ -->
          <section id="ecran-question" class="ecran cache">
               <article class="question">
                    <h2 id="texte-question">De quel pays est originaire le tchep ?</h2>
               </article>
               <article class="avancement-question">
                    <p>Question <span id="question-actuelle">1 </span> sur <span>10</span></p>
                    <p>Score: <span id="score">0</span></p>
               </article>
               <article class="réponse-question">
                    <picture class="container-image-question">
                         <img id="image-question" src="assets/plat-tchep-poisson.jpeg" alt="plat de tchep au poisson encore fumant">
                    </picture>
                    <ul id="input-question">
                         <button></button>
                         <button></button>
                         <button></button>
                         <button></button>
                    </ul>
               </article>
               <article class="validation-réponse">
                    <aside id="commentaires-réponses">
                         <p id="commentaires"></p>
                         <button type="button" id="btn-suivante">suivante</button>
                    </aside>
                    <aside class="barre-progression">
                         <!-- Le conteneur : c'est ici que vous changez la couleur de fond -->
                         <div class="progress-container">
                         <!-- La barre d'avancement : c'est ici que vous changez la couleur de remplissage -->
                              <div id="progress-bar" style="width: 0%;"></div>
                         </div>
                    </aside>
               </article>
          </section>

          <!-- ═══════════════════════════════════════
               ÉCRAN 3 — RÉSULTATS
               Caché au départ. Affiché à la fin du quiz.
          ════════════════════════════════════════ -->
          <section id="ecran-resultats" class="ecran cache">
               <article class="container-titre-ecran-resultat">
                    <h2>AdaQuiz</h2>
                    <h3>Résultat</h3>
               </article>
               <article class="container-score">
                    <p><span id="score-final"></span>/<span id="score-maximum"></span></p>
                    <p id="resultat-message">Good job</p>
               </article>
               <article class="container-recommencer">
                    <button id="btn-recommencer">Recommencer</button>
               </article>
          </section>

     </main>

     <footer>
          <p>Contact</p>
          <hr>
          <ul class="social-links">
               <li><a href="https://github.com/sidoniemakolo03-dot" target="_blank" ><i class="fa-brands fa-square-github" style="color: rgb(71, 153, 152);font-size: 2rem;"></i></i>Sidonie</a></li>
               <li><a href="https://github.com/Fabiola971" target="_blank" ><i class="fa-brands fa-square-github" style="color: rgb(71, 153, 152);font-size: 2rem;"></i></i>F@biol@</a></li>
          </ul>
     </footer>
  <script src="questions.js" defer></script>
  <script src="script.js" defer></script>
</body>

</html>
