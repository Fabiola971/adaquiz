<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <title>Ressources naturelles et mets culinaires</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
     <header>
          <nav>
               <ul class="nav-links">
                    <li><h1><a href="">QuizzTime</a></h1></li>
                    <li><a href="">Theme</a></li>
               </ul>
          </nav>
     </header>
     <main>
          <!-- ═══════════════════════════════════════
               ÉCRAN 1 — ACCUEIL
               Affiché au départ. Caché quand on clique sur "Commencer".
          ════════════════════════════════════════ -->
          <section id="ecran-accueil" class="ecran">
          </section>

          <!-- ═══════════════════════════════════════
               ÉCRAN 2 — QUESTION
               Caché au départ. Affiché pendant le quiz.
          ════════════════════════════════════════ -->
          <section id="ecran-question" class="ecran ache">
               <article class="question">
                    <h2>De quel pays est originaire le tchep ?</h2>
               </article>
          </section>

          <!-- ═══════════════════════════════════════
               ÉCRAN 3 — RÉSULTATS
               Caché au départ. Affiché à la fin du quiz.
          ════════════════════════════════════════ -->
          <section id="ecran-resultats" class="ecran cache">
          </section>

     </main>

     <footer>
          <p>Contact</p>
          <hr>
          <ul class="social-links">
               <li><a href="https://github.com/sidoniemakolo03-dot" target="_blank" ><i class="fa-brands fa-square-github" style="color: rgb(71, 153, 152);font-size: 2rem;"></i></i>Sidonie</a></li>
               <li><a href="https://github.com/Fabiola971" target="_blank" ><i class="fa-brands fa-square-github" style="color: rgb(71, 153, 152);font-size: 2rem;"></i></i>F@biol@</a></li>
          </ul>
     </footer>

  <script src="script.js" defer></script>
</body>

</html>
